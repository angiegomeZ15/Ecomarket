<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>EcoMarket B2B</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">EcoMarket</a>
            {% if session.get('user') %}
            <div>
                <a href="{{ url_for('dashboard') }}" class="btn btn-outline-light me-2">Estadísticas</a>
                <a href="{{ url_for('productos') }}" class="btn btn-outline-light me-2">Gestión CRUD</a>
                <a href="{{ url_for('logout') }}" class="btn btn-danger">Cerrar Sesión</a>
            </div>
            {% endif %}
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
