{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-warning text-dark">
                <h4>Editar Registro #{{ producto.id }}</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label>Nombre del Producto</label>
                        <input type="text" name="producto" value="{{ producto.producto }}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Ciudad</label>
                        <input type="text" name="ciudad" value="{{ producto.ciudad }}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Ventas ($)</label>
                        <input type="number" step="0.01" name="ventas" value="{{ producto.ventas }}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Satisfacción</label>
                        <input type="number" step="0.1" name="satisfaccion" value="{{ producto.satisfaccion }}" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-warning">Actualizar</button>
                    <a href="{{ url_for('productos') }}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
